# 项目展示

- slug: rag-customer-service
  title: 企业级 RAG 智能客服 Agent
  category: AI · 后端 · Full Stack
  tech_stack:
    - LangGraph
    - FastAPI
    - Next.js 14
    - ChromaDB
    - DeepSeek
    - Docker
  summary: >-
    基于 LangGraph 多阶段 Agent 编排的企业级智能客服系统，集成 RAG 检索增强生成、
    风险评估与人工转接机制，支持 SSE 流式响应。
  highlights:
    - 多阶段 Agent Pipeline：意图分类 → 字段提取 → 完整性检查 → 知识库检索 → 业务查询 → 风险评估 → 回复生成
    - ChromaDB 向量存储 + text-embedding-3-small 实现语义检索
    - 风险评估节点自动判断低/中/高风险，触发人工转接
    - SSE 流式响应实时推送 Agent 节点状态
